<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تولید آیکون‌های کیف زرگر</title>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: #17191c;
    color: #eeece7;
    padding: 20px;
    margin: 0;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { color: #c4a875; text-align: center; }
  p { text-align: center; color: #92969c; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
  }
  .card {
    background: #202327;
    border: 1px solid #30343a;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .card canvas {
    width: 100%;
    max-width: 180px;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto 12px;
  }
  .card .label {
    font-size: 11px;
    color: #92969c;
    margin-bottom: 8px;
  }
  .card button {
    width: 100%;
    padding: 10px;
    background: #c4a875;
    color: #17191c;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .card button:hover { opacity: 0.9; }
  .info {
    background: #202327;
    border: 1px solid #30343a;
    border-radius: 12px;
    padding: 16px;
    margin-top: 30px;
    font-size: 12px;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 تولید آیکون‌های کیف زرگر</h1>
  <p>روی هر دکمه کلیک کن تا فایل PNG دانلود بشه</p>

  <div class="grid">
    <div class="card">
      <canvas id="c-512"></canvas>
      <div class="label">512×512 — آیکون اصلی</div>
      <button onclick="download('c-512', 'icon-512.png')">📥 دانلود</button>
    </div>
    <div class="card">
      <canvas id="c-192"></canvas>
      <div class="label">192×192</div>
      <button onclick="download('c-192', 'icon-192.png')">📥 دانلود</button>
    </div>
    <div class="card">
      <canvas id="c-m-512"></canvas>
      <div class="label">Maskable 512 (اندروید)</div>
      <button onclick="download('c-m-512', 'icon-maskable-512.png')">📥 دانلود</button>
    </div>
    <div class="card">
      <canvas id="c-m-192"></canvas>
      <div class="label">Maskable 192 (اندروید)</div>
      <button onclick="download('c-m-192', 'icon-maskable-192.png')">📥 دانلود</button>
    </div>
    <div class="card">
      <canvas id="c-apple"></canvas>
      <div class="label">Apple 180×180 (آیفون)</div>
      <button onclick="download('c-apple', 'apple-touch-icon.png')">📥 دانلود</button>
    </div>
  </div>

  <div class="info">
    <strong style="color:#c4a875">📁 فایل‌ها رو کجا بذارم؟</strong><br>
    همه‌ی فایل‌های دانلود شده رو بریز توی پوشه‌ی:<br>
    <code style="background:#17191c;padding:2px 6px;border-radius:4px;font-family:monospace">public/icons/</code>
  </div>
</div>

<script>
const GOLD = "#c4a875";
const BG = "#17191c";

function drawIcon(canvasId, size, maskable) {
  const canvas = document.getElementById(canvasId);
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, size, size);

  const gradient = ctx.createLinearGradient(0, 0, size, size);
  gradient.addColorStop(0, "rgba(196,168,117,0.2)");
  gradient.addColorStop(1, "rgba(196,168,117,0.02)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  ctx.strokeStyle = GOLD;
  if (!maskable) {
    ctx.lineWidth = size * 0.03;
    const m = size * 0.07;
    ctx.strokeRect(m, m, size - m * 2, size - m * 2);
  } else {
    ctx.lineWidth = size * 0.025;
    const m = size * 0.15;
    ctx.strokeRect(m, m, size - m * 2, size - m * 2);
  }

  ctx.fillStyle = GOLD;
  ctx.font = `bold ${size * (maskable ? 0.45 : 0.55)}px Tahoma, Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("ک", size / 2, size / 2 + size * 0.02);

  ctx.globalAlpha = 0.6;
  ctx.font = `bold ${size * 0.05}px Tahoma, sans-serif`;
  ctx.fillText("KIFE ZARGAR", size / 2, size * (maskable ? 0.78 : 0.85));
  ctx.globalAlpha = 1;
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }, "image/png");
}

drawIcon("c-512", 512, false);
drawIcon("c-192", 192, false);
drawIcon("c-m-512", 512, true);
drawIcon("c-m-192", 192, true);
drawIcon("c-apple", 180, false);
</script>
</body>
</html>
